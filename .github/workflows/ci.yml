name: leak scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    name: repo tree + pipeline leak scan, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Nothing is installed on purpose: both gates run on the standard library.

      # Gate 1: every tracked file is screened for credential shapes, key
      # blocks, tokens, private network addresses, machine-specific paths, and
      # email addresses. The run also scans a planted-secret negative control
      # and fails unless every planted pattern is caught, so this gate is
      # demonstrably able to fail.
      - name: Repo-wide leak scan (all tracked files + negative control)
        run: python leak_scan.py

      # Gate 2: the pipeline itself. All six tool outputs plus the system
      # prompt are leak-scanned, the sanitizer must reproduce the expected
      # snapshot, and the fail-closed tripwire is exercised.
      - name: Pipeline leak gate (tools, prompt, fail-closed proof)
        run: python test_flow.py
